version: 2
updates:
  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "security"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
        exclude-patterns:
        - torch*
        - transformers
        - accelerate
        - vllm
        - unsloth*
        - openai
    cooldown:
      default-days: 3

  # Python (pip) dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
        exclude-patterns:
        - torch*
        - transformers
        - accelerate
        - vllm
        - unsloth*
        - openai
    # Hatun imports mcp.server.fastmcp, which was removed in mcp 2.x.
    # Keep receiving compatible 1.x updates without reopening the major-version
    # outage that reached protected main in Dependabot PR #84.
    ignore:
      - dependency-name: "mcp"
        update-types:
          - "version-update:semver-major"
    cooldown:
      default-days: 7
      semver-major-days: 21
      semver-minor-days: 7
      semver-patch-days: 3

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/New_York"
    labels:
      - "dependencies"
      - "security"
    open-pull-requests-limit: 3
    groups:
      docker-deps:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
        exclude-patterns:
        - torch*
        - transformers
        - accelerate
        - vllm
        - unsloth*
        - openai
    cooldown:
      default-days: 3
