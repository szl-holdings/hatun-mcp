name: Install Hatun MCP Holo-Constellation v2 on Branch

on:
  push:
    branches:
      - design/holographic-space-v2-manual
    paths:
      - ".github/workflows/manual-holo-v2-on-branch.yml"

permissions:
  contents: write

concurrency:
  group: hatun-mcp-holo-v2-manual
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact adapter branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: design/holographic-space-v2-manual
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Fetch immutable first-party Holo assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen

          base = "https://raw.githubusercontent.com/szl-holdings/a11oy/a8494fc4d40d0918d33d72e64739eedbd4c33803/console/assets"
          target = Path("hatun_mcp/static")
          target.mkdir(parents=True, exist_ok=True)
          for name in ("szl-holo-v2.css", "szl-holo-v2.js"):
              request = Request(f"{base}/{name}", headers={"User-Agent": "szl-hatun-holo-adapter/2"})
              with urlopen(request, timeout=30) as response:
                  payload = response.read()
              if len(payload) < 1000:
                  raise SystemExit(f"canonical asset unexpectedly small: {name}")
              (target / name).write_bytes(payload)
          PY

      - name: Bind the Starlette console without changing MCP negotiation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("hatun_mcp/server_http.py")
          text = path.read_text(encoding="utf-8")
          if "from pathlib import Path" not in text:
              anchor = "import os\n"
              if anchor not in text:
                  raise SystemExit("os import anchor not found")
              text = text.replace(anchor, anchor + "from pathlib import Path\n", 1)

          console_anchor = "from .console import CONSOLE_HTML\n"
          asset_block = '''from .console import CONSOLE_HTML\n\n_HOLO_DIR = Path(__file__).resolve().parent / "static"\n_HOLO_CSS = (_HOLO_DIR / "szl-holo-v2.css").read_text(encoding="utf-8")\n_HOLO_JS = (_HOLO_DIR / "szl-holo-v2.js").read_text(encoding="utf-8")\n_HOLO_STYLE_TAG = '<link rel="stylesheet" href="/assets/szl-holo-v2.css" data-szl-holo-asset="style-v2" />'\n_HOLO_SCRIPT_TAG = '<script src="/assets/szl-holo-v2.js" defer data-szl-holo-asset="script-v2"></script>'\nCONSOLE_HOLO_HTML = CONSOLE_HTML.replace("</head>", f"  {_HOLO_STYLE_TAG}\\n</head>", 1).replace("</body>", f"  {_HOLO_SCRIPT_TAG}\\n</body>", 1)\n'''
          if "CONSOLE_HOLO_HTML" not in text:
              if console_anchor not in text:
                  raise SystemExit("console import anchor not found")
              text = text.replace(console_anchor, asset_block, 1)

          text = text.replace(
              'return HTMLResponse(CONSOLE_HTML, headers={"Cache-Control": "no-store"})',
              'return HTMLResponse(CONSOLE_HOLO_HTML, headers={"Cache-Control": "no-store"})',
              1,
          )

          route_function_anchor = "async def index(request: Request):\n"
          asset_routes = '''async def holo_css(_: Request) -> PlainTextResponse:\n    return PlainTextResponse(_HOLO_CSS, media_type="text/css", headers={"Cache-Control": "public, max-age=31536000, immutable"})\n\n\nasync def holo_js(_: Request) -> PlainTextResponse:\n    return PlainTextResponse(_HOLO_JS, media_type="application/javascript", headers={"Cache-Control": "public, max-age=31536000, immutable"})\n\n\n'''
          if "async def holo_css" not in text:
              if route_function_anchor not in text:
                  raise SystemExit("index route anchor not found")
              text = text.replace(route_function_anchor, asset_routes + route_function_anchor, 1)

          routes_anchor = '        Route("/", index),\n'
          routes = routes_anchor + '        Route("/assets/szl-holo-v2.css", holo_css),\n        Route("/assets/szl-holo-v2.js", holo_js),\n'
          if 'Route("/assets/szl-holo-v2.css"' not in text:
              if routes_anchor not in text:
                  raise SystemExit("Starlette route-list anchor not found")
              text = text.replace(routes_anchor, routes, 1)

          path.write_text(text, encoding="utf-8", newline="\n")
          PY

      - name: Prove browser and machine-client boundaries
        run: |
          python3 -m py_compile hatun_mcp/server_http.py hatun_mcp/console.py
          python3 - <<'PY'
          from pathlib import Path
          text = Path("hatun_mcp/server_http.py").read_text(encoding="utf-8")
          assert text.count("CONSOLE_HOLO_HTML") == 2
          assert text.count('Route("/assets/szl-holo-v2.css"') == 1
          assert text.count('Route("/assets/szl-holo-v2.js"') == 1
          assert 'if "application/json" in accept:' in text
          assert "return JSONResponse(_INDEX_JSON)" in text
          assert "script-src 'self' 'unsafe-inline'" in text
          assert "style-src 'self' 'unsafe-inline'" in text
          assert Path("hatun_mcp/static/szl-holo-v2.css").stat().st_size > 1000
          assert Path("hatun_mcp/static/szl-holo-v2.js").stat().st_size > 1000
          PY
          git diff --check

      - name: Commit adapter and remove one-shot controller
        run: |
          set -euo pipefail
          rm .github/workflows/manual-holo-v2-on-branch.yml
          git config user.name "SZL Hatun Holo Controller"
          git config user.email "stephenlutar2@gmail.com"
          git add hatun_mcp/server_http.py hatun_mcp/static/szl-holo-v2.css hatun_mcp/static/szl-holo-v2.js .github/workflows/manual-holo-v2-on-branch.yml
          git commit -s -m "feat(frontend): install Hatun MCP Holo-Constellation v2"
          git push origin HEAD:design/holographic-space-v2-manual
