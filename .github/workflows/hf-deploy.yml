# SPDX-License-Identifier: Apache-2.0
name: Deploy to HuggingFace Space

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hf-deploy.yml
      - Dockerfile
      - README.md
      - requirements.txt
      - hatun_mcp/**
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: hatun-mcp-hf-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish, source-bind, and attest Hatun MCP
    uses: szl-holdings/.github/.github/workflows/reusable-hf-deploy.yml@86c4e95fdceedfb1e7e226ad3c8f5f844bd2aae4
    with:
      hf-repo: SZLHOLDINGS/hatun-mcp
      ref: ${{ github.sha }}
      include-readme: true
      prune: true
      restart-space: true
      wait-running: 1200
      require-default-branch-tip: true
      source-revision-variable: SZL_GIT_SHA
      source-revision-probe-path: /api/build-info
      smoke-paths: '["/","/healthz","/.well-known/mcp/server-card.json","/.well-known/mcp-manifest-attestation","/api/build-info"]'
    secrets:
      HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
