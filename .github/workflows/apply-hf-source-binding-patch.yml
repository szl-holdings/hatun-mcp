name: Apply Hatun HF Source Binding Patch — Controlled

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/apply-hf-source-binding-patch.yml
      - scripts/apply_hf_source_binding_patch.py
      - tests/test_hf_deploy_contract.py
      - .github/workflows/hf-deploy.yml
      - .github/workflows/hf-drift-check.yml
      - .github/hf-module-drift-allow.json

permissions:
  contents: write

concurrency:
  group: apply-hatun-source-binding-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    name: Deterministically wire build identity and card metadata
    if: >-
      github.repository == 'szl-holdings/hatun-mcp' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/source-bound-hf-deploy-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Apply and compile the bounded changes
        run: |
          set -euo pipefail
          python -m py_compile scripts/apply_hf_source_binding_patch.py
          python scripts/apply_hf_source_binding_patch.py
          python -m py_compile hatun_mcp/server_http.py tests/test_http_routes.py tests/test_hf_deploy_contract.py
          git diff --check
      - name: Create one GitHub-signed exact source commit
        id: commit
        shell: python
        run: |
          import base64
          import json
          import os
          import subprocess
          import urllib.error
          import urllib.request
          from pathlib import Path

          paths = (
              'README.md',
              'hatun_mcp/server_http.py',
              'tests/test_http_routes.py',
          )
          changed = subprocess.run(
              ['git', 'diff', '--quiet', '--', *paths],
              check=False,
          ).returncode != 0
          if not changed:
              print('Source binding is already exact.')
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
                  output.write('created=false\n')
              raise SystemExit(0)

          additions = [
              {
                  'path': path,
                  'contents': base64.b64encode(Path(path).read_bytes()).decode('ascii'),
              }
              for path in paths
          ]
          query = '''
          mutation($input: CreateCommitOnBranchInput!) {
            createCommitOnBranch(input: $input) {
              commit { oid url }
            }
          }
          '''
          variables = {
              'input': {
                  'branch': {
                      'repositoryNameWithOwner': os.environ['GITHUB_REPOSITORY'],
                      'branchName': os.environ['HEAD_BRANCH'],
                  },
                  'message': {
                      'headline': 'fix(hf): wire exact runtime source identity',
                      'body': 'Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>',
                  },
                  'expectedHeadOid': os.environ['EXPECTED_HEAD'],
                  'fileChanges': {'additions': additions},
              }
          }
          body = json.dumps({'query': query, 'variables': variables}).encode('utf-8')
          request = urllib.request.Request(
              'https://api.github.com/graphql',
              data=body,
              method='POST',
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'hatun-source-binding/1',
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  payload = json.loads(response.read())
          except urllib.error.HTTPError as exc:
              detail = exc.read().decode('utf-8', errors='replace')[:4000]
              print(f'GraphQL HTTP {exc.code}: {detail}')
              raise SystemExit(1) from exc

          errors = payload.get('errors') or []
          if errors:
              print(json.dumps(errors, indent=2))
              raise SystemExit(1)
          commit = payload['data']['createCommitOnBranch']['commit']
          print(json.dumps(commit, indent=2, sort_keys=True))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('created=true\n')
              output.write(f"sha={commit['oid']}\n")
      - name: Verify exact branch head after signed publication
        if: steps.commit.outputs.created == 'true'
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          observed="$(gh api "repos/$GITHUB_REPOSITORY/branches/$HEAD_BRANCH" --jq .commit.sha)"
          test "$observed" = "$COMMIT_SHA"
          verification="$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT_SHA" --jq .commit.verification.verified)"
          reason="$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT_SHA" --jq .commit.verification.reason)"
          test "$verification" = 'true'
          test "$reason" = 'valid'
