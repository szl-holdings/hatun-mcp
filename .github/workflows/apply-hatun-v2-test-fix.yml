name: Apply clean Hatun contract correction

on:
  push:
    branches:
      - fix/hf-runtime-restart-tip-guard-v2
    paths:
      - .github/workflows/apply-hatun-v2-test-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact clean repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/hf-runtime-restart-tip-guard-v2
          fetch-depth: 0

      - name: Correct the smoke-path assertion and execute the contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/test_hf_deploy_contract.py")
          lines = path.read_text(encoding="utf-8").splitlines()
          matches = [
              index
              for index, line in enumerate(lines)
              if line.strip().startswith("assert 'smoke-paths: ")
          ]
          if len(matches) != 1:
              raise SystemExit(f"expected one malformed smoke assertion, found {len(matches)}")
          lines[matches[0]] = r'''    assert "smoke-paths: '[\"/\",\"/healthz\",\"/.well-known/mcp/server-card.json\",\"/.well-known/mcp-manifest-attestation\",\"/api/build-info\"]'" in workflow'''
          path.write_text("\n".join(lines) + "\n", encoding="utf-8", newline="\n")
          PY
          python3 -m py_compile tests/test_hf_deploy_contract.py
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("tests/test_hf_deploy_contract.py")
          spec = importlib.util.spec_from_file_location("hatun_hf_contract", path)
          if spec is None or spec.loader is None:
              raise SystemExit("unable to load Hatun HF contract")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          tests = sorted(
              (name, value)
              for name, value in vars(module).items()
              if name.startswith("test_") and callable(value)
          )
          if not tests:
              raise SystemExit("no Hatun HF contract tests discovered")
          for name, test in tests:
              test()
              print(f"PASS {name}")
          PY
          git diff --check

      - name: Commit the correction and remove this controller
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-hatun-v2-test-fix.yml
          git config user.name "SZL Hatun Runtime Controller"
          git config user.email "stephenlutar2@gmail.com"
          git add tests/test_hf_deploy_contract.py .github/workflows/apply-hatun-v2-test-fix.yml
          git commit -s -m "test(hf): correct the Hatun smoke-path contract"
          git push origin HEAD:fix/hf-runtime-restart-tip-guard-v2
