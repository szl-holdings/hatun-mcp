name: HF Module Drift Check

# Strict post-deployment parity. The default-branch sweep runs only after the
# governed Space deployer succeeds, eliminating the old race where drift checked
# stale live bytes before publication completed. Scheduled/manual checks remain
# read-only and fail on any source/live divergence.

on:
  workflow_run:
    workflows:
      - Deploy to HuggingFace Space
    types:
      - completed
  schedule:
    - cron: "37 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: hf-drift-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hf-drift:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    uses: szl-holdings/.github/.github/workflows/reusable-hf-module-drift-check.yml@5d339cf22e394635285f2c5fccb14d9ebb4f7455
    with:
      hf-repo: SZLHOLDINGS/hatun-mcp
      ref: main
      mode: direct
      dockerfile-path: Dockerfile
