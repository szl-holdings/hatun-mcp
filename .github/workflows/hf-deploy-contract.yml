name: Hatun Consolidated Surface Contract

on:
  pull_request:
    branches: [main]
    paths:
      - README.md
      - Dockerfile
      - requirements.txt
      - hatun_mcp/console.py
      - hatun_mcp/console_v2.py
      - hatun_mcp/server.py
      - hatun_mcp/server_http.py
      - docs/HATUN_SURFACE_CONTRACT.md
      - tests/test_console_state.py
      - tests/test_dependency_contract.py
      - tests/test_http_routes.py
      - tests/test_hf_deploy_contract.py
      - .github/workflows/hf-drift-check.yml
      - .github/workflows/hf-deploy-contract.yml
  push:
    branches: [main]
    paths:
      - README.md
      - Dockerfile
      - requirements.txt
      - hatun_mcp/console.py
      - hatun_mcp/console_v2.py
      - hatun_mcp/server.py
      - hatun_mcp/server_http.py
      - docs/HATUN_SURFACE_CONTRACT.md
      - tests/test_console_state.py
      - tests/test_dependency_contract.py
      - tests/test_http_routes.py
      - tests/test_hf_deploy_contract.py
      - .github/workflows/hf-drift-check.yml
      - .github/workflows/hf-deploy-contract.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: hatun-consolidated-surface-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source runtime, retired publisher, and canonical product route
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install contract runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Enforce the consolidated surface authority contract
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_hf_deploy_contract.py
          git diff --check
